spring:
    application:
        name: jira
    # DataSource – los valores se sobreescriben con las
    # variables de entorno del docker-compose en producción
    # ─────────────────────────────────────────────────────
    datasource:
        url: jdbc:postgresql://localhost:5432/jira_db
        username: jira_user
        password: jira_pass
        driver-class-name: org.postgresql.Driver

    # ─────────────────────────────────────────────────────
    # JPA / Hibernate
    # ─────────────────────────────────────────────────────
    jpa:
        hibernate:
            # validate → Hibernate verifica que el esquema coincida
            # con las entidades pero NO lo modifica (Flyway lo gestiona)
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    # ─────────────────────────────────────────────────────
    # Flyway – migraciones automáticas al arrancar
    # ─────────────────────────────────────────────────────
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
